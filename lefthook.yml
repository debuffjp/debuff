# Show only failures and the summary line.
output:
  - summary
  - failure

# Fast local checks so most problems never reach CI. Skip once with LEFTHOOK=0.
pre-commit:
  parallel: true
  jobs:
    - name: format + lint staged
      glob: "*.{ts,mts,js,mjs,json,md}"
      run: npx --no-install biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    # One job, in order: a few tests run the built CLI, keiko and MCP binaries, so tsc builds them first.
    - name: typecheck + unit tests
      run: node scripts/check-install.mjs && npx --no-install tsc -b && npx --no-install vitest run
