name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint:packages
      # Scenarios drive the runner's preinstalled Chrome via playwright-core.
      # Baselines are per platform; a missing one is recorded (not failed) and uploaded below.
      - run: npm run test:scenarios
      - name: Upload scenario captures and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            templates/*/.debuff/
            templates/*/scenarios/__baselines__/
          if-no-files-found: ignore
