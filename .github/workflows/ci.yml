name: CI

# One fast Linux job on every push and pull request. The full OS × Node and
# package-manager matrix lives in matrix.yml (weekly and on demand).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write # dispatched runs report to the PR as a commit status

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint:packages
      - run: npm run test:scenarios
      - name: Upload scenario captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: |
            templates/*/.debuff/
            templates/*/scenarios/__baselines__/
          if-no-files-found: ignore
          include-hidden-files: true # .debuff/ holds the captures, diffs and reports
      # Release dispatches this on the Version packages PR. A dispatched run's check isn't listed on the PR,
      # so report its result as a commit status, which is.
      - name: Report to the Version packages PR
        if: always() && github.event_name == 'workflow_dispatch'
        run: >
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }}
          -f state=${{ job.status == 'success' && 'success' || 'failure' }}
          -f context=CI -f description="npm run check on ${{ github.ref_name }}"
          -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
