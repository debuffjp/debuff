name: CI

# One fast Linux job on every push and pull request. The full OS × Node and
# package-manager matrix lives in matrix.yml (weekly and on demand).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint:packages
      - run: npm run test:scenarios
      - name: Upload scenario captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: |
            templates/*/.debuff/
            templates/*/scenarios/__baselines__/
          if-no-files-found: ignore
