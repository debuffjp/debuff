name: Release

# On every push to main: publish whatever version isn't on npm yet, tag it and point the
# plugins at the new @debuffjp/mcp; then open or update the "Version packages" PR from
# pending changesets. Publishing runs first and on its own, so a merged Version PR still
# ships when new changesets have landed since. See docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch CI on the Version packages PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the commits since the last release
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5+, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Is this version new?
        id: fresh
        run: |
          v=$(node -p "require('./tooling/cli/package.json').version")
          if npm view "@debuffjp/cli@$v" version > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      # A no-op when every version is already on npm.
      - name: Publish unpublished versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release:ci
      # Commits that say "Fixes papercut #12" mark #12 fixed in this version on papercuts.debuff.jp.
      - name: Mark fixed papercuts
        if: steps.fresh.outputs.new == 'true'
        continue-on-error: true
        run: node scripts/papercuts-fixed.mjs
        env:
          PAPERCUTS_FIX_TOKEN: ${{ secrets.PAPERCUTS_FIX_TOKEN }}
      - uses: changesets/action@v2
        id: changesets
        with:
          pr-title: Version packages
          commit-message: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PRs opened with GITHUB_TOKEN don't trigger CI (they wait at "action_required"); a dispatch is the
      # one event that token may start, and its checks land on the PR's head commit.
      - name: Run CI on the Version packages PR
        if: steps.changesets.outputs.has-changesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
