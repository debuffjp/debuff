name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Opens or updates a "Version packages" PR from pending changesets.
      # Publishing happens locally with `npm run release` (see docs/releasing.md).
      - uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
