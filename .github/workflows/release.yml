name: Release

# On every push to main: publish whatever version isn't on npm yet, tag it and point the
# plugins at the new @debuffjp/mcp; then open or update the "Version packages" PR from
# pending changesets. Publishing runs first and on its own, so a merged Version PR still
# ships when new changesets have landed since. See docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_CHANGESETS_TOKEN: ${{ secrets.CHANGESETS_TOKEN != '' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch CI on the Version packages PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the commits since the last release
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5+, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Is this version new?
        id: fresh
        run: |
          v=$(node -p "require('./tooling/cli/package.json').version")
          if npm view "@debuffjp/cli@$v" version > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      # Fails with what to do, instead of changeset publish's raw E404, when a new package was never published.
      - name: Every package exists on npm
        run: node scripts/check-first-publish.mjs
      # A no-op when every version is already on npm.
      - name: Publish unpublished versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release:ci
      # Commits that say "Fixes papercut #12" mark #12 fixed in this version on papercuts.debuff.jp.
      - name: Mark fixed papercuts
        if: steps.fresh.outputs.new == 'true'
        continue-on-error: true
        run: node scripts/papercuts-fixed.mjs
        env:
          PAPERCUTS_FIX_TOKEN: ${{ secrets.PAPERCUTS_FIX_TOKEN }}
      - name: Sync the spryte mirror
        continue-on-error: true
        run: |
          if [ -z "$SPRYTE_MIRROR_TOKEN" ]; then echo "::warning::SPRYTE_MIRROR_TOKEN is not set, so debuffjp/spryte was not synced"; exit 0; fi
          node scripts/sync-spryte-mirror.mjs --push
        env:
          SPRYTE_MIRROR_TOKEN: ${{ secrets.SPRYTE_MIRROR_TOKEN }}
      # The Version packages branch is pushed with git's credentials, which checkout set to GITHUB_TOKEN, and
      # pushes by that token start no workflows. Push it as the CHANGESETS_TOKEN account instead, so updates to
      # the PR get CI too. Only this step's pushes change: release:ci above already pushed main as GITHUB_TOKEN,
      # which keeps a release push from starting another Release run.
      - name: Push the Version packages branch with CHANGESETS_TOKEN
        if: ${{ !cancelled() && env.HAS_CHANGESETS_TOKEN == 'true' }}
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${CHANGESETS_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          CHANGESETS_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
      # Keeps the Version packages PR current even when publishing failed above: publishing is retried on every
      # push, and a stuck publish shouldn't also freeze the PR (it did for 3.5 hours while henka was missing).
      - uses: changesets/action@v2
        id: changesets
        if: ${{ !cancelled() }}
        with:
          pr-title: Version packages
          commit-message: Version packages
        env:
          # With a CHANGESETS_TOKEN secret (a fine-grained token with contents and pull-requests write), the PR is
          # opened as that account and gets normal pull_request CI. Without it, GITHUB_TOKEN opens it, GitHub
          # holds its CI at "action_required", and the run is marked failed with no jobs once the PR merges.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
      # PRs opened with GITHUB_TOKEN don't trigger CI (they wait at "action_required"); a dispatch is the
      # one event that token may start, and its checks land on the PR's head commit. Not needed with a token.
      - name: Run CI on the Version packages PR
        if: ${{ !cancelled() && steps.changesets.outputs.has-changesets == 'true' && env.HAS_CHANGESETS_TOKEN != 'true' }}
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
