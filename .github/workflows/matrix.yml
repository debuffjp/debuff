name: Matrix

# Broad compatibility: every OS × Node version, and create + build with every package manager.
# Runs weekly and on demand. Run it manually before merging a "Version packages" PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload scenario captures and baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            templates/*/.debuff/
            templates/*/scenarios/__baselines__/
          if-no-files-found: ignore

  package-managers:
    name: create + build with ${{ matrix.pm }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        pm: [npm, pnpm, yarn, bun]
        include:
          - os: windows-latest
            pm: pnpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - if: matrix.pm == 'yarn'
        run: corepack enable && corepack prepare yarn@stable --activate
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-package-manager.mjs ${{ matrix.pm }} --scenarios
