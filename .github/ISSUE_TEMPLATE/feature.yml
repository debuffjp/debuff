name: Feature proposal
description: Suggest a capability. Small, evidence-backed proposals land fastest.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Ideally from a real game or jam entry.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [runtime, input, assets, audio, juice, cli, agent tooling, templates, docs, community/jams]
